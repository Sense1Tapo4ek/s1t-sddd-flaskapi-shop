version: "3.9"

services:
  db:
    image: mysql:5.7
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ushop", "-pshop"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./media:/app/media
      - ./data:/app/data
    environment:
      PYTHONPATH: /app/src
      INFRA_DATABASE_URL: mysql+pymysql://shop:shop@db:3306/shop?charset=utf8mb4
      ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET:-change-me-in-production}
      ACCESS_DEFAULT_LOGIN: ${ACCESS_DEFAULT_LOGIN:-admin}
      ACCESS_DEFAULT_PASSWORD: ${ACCESS_DEFAULT_PASSWORD:-changeme}
      CATALOG_UPLOAD_DIR: media/products
      SYSTEM_RECOVERY_TOKEN: ${SYSTEM_RECOVERY_TOKEN:-change-me-in-production}
      ROOT_APP_ENV: ${ROOT_APP_ENV:-dev}
      FLASK_DEBUG: "0"
    restart: unless-stopped

volumes:
  mysql_data:
