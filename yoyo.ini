[DEFAULT]
# yoyo-migrations configuration.
#
# `database` is filled at runtime from INFRA_DATABASE_URL by scripts/db_apply.py
# and friends. The placeholder below is for direct CLI use:
#   yoyo apply --database "$INFRA_DATABASE_URL" ./migrations
sources = %(here)s/migrations
migration_table = _yoyo_migration
batch_mode = on
verbosity = 1
